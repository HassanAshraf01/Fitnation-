<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
     <link href="https://fonts.googleapis.com/css2?family=Poppins&display=swap" rel="stylesheet">

</head>
<style>
  .nav-link i
  {
    color: rgb(19, 158, 112);
    transition: transform 0.2s ease;
    font-size: 24px;
  }
  .nav-link:hover
  {
    background-color:white;
    transform: scale(1.2);
  }
  .signin button:hover
  {
    background-attachment: rgb(1, 1, 24);
  }
</style>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container-fluid">
        <div class="collapse navbar-collapse" id="navbarContent">
      <ul class="navbar-nav me-auto mb-2 mb-lg-0">
        <li class="nav-item me-3">
          <a class="nav-link" href="/"><i class="fas fa-home fa-2x"></i></a>
        </li>
        <li class="nav-item me-3">
          <a class="nav-link" href="{% url 'about' %}" > <i class="fas fa-info-circle fa-2x"></i></a>
        </li>
        <li class="nav-item me-3">
          <a class="nav-link" href="{% url 'contact' %}"><i class="bi bi-telephone-fill" style="font-size: 1.5rem;"></i></a>
        </li>
      </ul>
      <ul class="navbar-nav ms-auto mb-2 mb-lg-0">
         {% if user.is_authenticated and not user.is_superuser %}
        <li class="nav-item">
          <a class="nav-link" href="#"><i class="fas fa-user-circle fa-lg"></i></a>
        </li>
        {% else %}
        <li class="nav-item">
         <a class="signin" href="{% url 'login' %}">
          <button class="btn btn-primary mt-3"> Login/ Sign Up</button>
         </a>
        </li>
        {% endif %}
      </ul>
      
        </div>
        </div>
        
    </nav>
    {% block content %}

    {% endblock %}

    

    <footer>

        <p> &copy; 2025 HealthFreak Gym </p>
    </footer>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        
        setTimeout(function()
        {
            let alert=document.getElementById("success-message");
            if (alert)
            {
                alert.classList.remove("show");
                alert.classList.add("fade");
            }
        },3000);
    </script>
</body>
</html>
