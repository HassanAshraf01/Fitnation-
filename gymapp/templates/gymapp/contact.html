{% extends 'gymapp/base.html' %}

{% block title %}Contact | Gym{% endblock %}
 {% block content %}
 <style>

  body{
    background-color: #1c1c1c;
    color: antiquewhite;
    background: url('https://images.unsplash.com/photo-1507398941214-572c25f4b1dc?q=80&w=773&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D')no-repeat center center/cover;
  }
  .contact-box
  {
    background-color: #2b2b2b;
    padding: 30px;
    border-radius: 10px;
    box-shadow: 0 0 15px rgba(0,0,0,0.6);
  }
  .btn-gym
  {
    background-color: #e63946;
    color: white;
    border: none;
  }
  .btn-gym:hover{
    background-color: #c92734;
  }
 </style>
 <div class="container py-5">
   <h2  class="text-center mb-4">Contact Us</h2>
  {% if messages %}
  {% for message in messages %}
   <div id="success-message" class="alert alert-success alert-dismissible fade show" role="alert">
    {{ message }}
   </div>
   {% endfor %}
   {% endif %}
   <div class="row justify-content-center">
   <div class="col-md-6 contact-box">
    <form method="POST" autocomplete="off">
       {% csrf_token %}
       <div class="mb-3">
        <label class="form-label">Name:</label>
        <input type="text" name="name" required class="form-control" style="background-color:aquamarine;">
       </div>
       <div class="mb-3">
         <label class="form-label">Your Message:-</label>
          <textarea name="message" rows="4" required class="form-control" style="background-color:aquamarine;"></textarea>
       </div>
       <button type="submit" class="btn btn-gym w-100">Submit</button>
      </form>
   </div>
   </div>
  </div>
 {% endblock %}
