{% extends 'gymapp/base.html' %}
{% load static %}
{% block title %} Register Member {% endblock %}
{% block content %}

<style>
    button{
        width: 200px;
    }
</style>
<div class="container mt-3">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="cardshadow-sm">
                <div class="card-body">
                    <h2 class="test-center mb-4">Register as a Member</h2>
                    {% if messages %}
                    {% for message in messages %}
                    <div id="success-message" class="alert alert-success alert-dismissible fade show" role="alert">{{message}}</div>
                    {% endfor %}
                    {% endif %}
                    <form method="post">
                       {% csrf_token %}
                       {{ form.as_p }}
                       <div class="d-grid">
                        <button type="submit" class="btn btn-primary mt-3">Register</button>
                       </div>
                       <div class="d-flex justify-content-end mt-3">
                        <a href="{% url 'home' %}" class="btn btn-secondary">Skip for now</a>
                       </div>
                    </form>
            </div>
        </div>
    </div>
</div>
</div>

 {% endblock %}
