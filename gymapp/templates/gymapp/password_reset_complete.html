{% extends 'gymapp/base.html' %}
{% block title %}Password Reset Complete | Gym{% endblock %}
{% block content %}
<style>
    :root {
        --neon-cyan: #00f2fe;
        --neon-blue: #4facfe;
        --dark-bg: #070a13;
        --card-bg: rgba(15, 23, 42, 0.75);
        --glass-border: rgba(255, 255, 255, 0.08);
        --text-main: #f8fafc;
        --text-muted: #94a3b8;
    }

    body {
        background: radial-gradient(circle at top, #111a2e 0%, #070a13 100%) !important;
        color: var(--text-main);
        font-family: 'Poppins', sans-serif;
        min-height: 100vh;
    }

    .form-wrapper {
        background: var(--card-bg);
        border: 1px solid var(--glass-border);
        padding: 3rem 2.5rem;
        border-radius: 20px;
        box-shadow: 0 15px 35px rgba(0, 0, 0, 0.35);
        max-width: 450px;
        width: 100%;
        margin: auto;
        backdrop-filter: blur(15px);
        -webkit-backdrop-filter: blur(15px);
        z-index: 5;
        position: relative;
    }

    .form-wrapper h2 {
        font-weight: 800;
        letter-spacing: 1px;
        background: linear-gradient(135deg, #ffffff 0%, #a1a1a1 100%);
        -webkit-background-clip: text;
        background-clip: text;
        -webkit-text-fill-color: transparent;
        text-transform: uppercase;
        margin-bottom: 1.5rem !important;
    }

    .form-wrapper p a {
        color: var(--neon-cyan);
        text-decoration: none;
        font-weight: 500;
        transition: all 0.3s ease;
    }

    .form-wrapper p a:hover {
        color: #fff;
        text-shadow: 0 0 8px rgba(0, 242, 254, 0.5);
    }
</style>

<div class="container d-flex justify-content-center align-items-center" style="min-height: 80vh; padding: 3rem 1rem;">
    <div class="form-wrapper text-center" data-aos="fade-up">
        <h2>Success!</h2>
        <p class="text-white-50 my-4">
            Your password has been successfully reset. You can now use your new credentials to log in.
        </p>
        <div class="text-center border-top border-secondary pt-3 mt-4">
            <p class="mb-0 text-white-50"><a href="{% url 'login' %}">Log In Now</a></p>
        </div>
    </div>
</div>
{% endblock %}
